<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezora Network</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0B1020;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 60px 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            color: #8EA2C8;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .card {
            background: #151C32;
            border-radius: 18px;
            padding: 30px 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            color: #B8C4DD;
            line-height: 1.6;
        }

        .code {
            margin: 25px 0;
            padding: 16px;
            background: #0B1020;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            background: white;
            color: #0B1020;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
        }

        .footer {
            margin-top: 40px;
            color: #68789D;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            REZORA NETWORK
        </div>

        <div class="tagline">
            MINE • CONNECT • EARN
        </div>

        <div class="card">

            <h1>Gabung Rezora Network</h1>

            <p>
                Mulai perjalananmu bersama Rezora Network.
                Gunakan kode referral di bawah untuk bergabung.
            </p>

            <div class="code">
                CF0F8FC2
            </div>

            <p>
                Buka aplikasi Rezora Network dan masukkan
                kode referral tersebut pada bagian Referral.
            </p>

        </div>

        <div class="footer">
            © Rezora Network
        </div>

    </div>

</body>
</html>
