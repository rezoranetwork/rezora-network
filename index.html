<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezora Network</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0B1020;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 60px 20px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            color: #8EA2C8;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .card {
            background: #151C32;
            border-radius: 18px;
            padding: 30px 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            color: #B8C4DD;
            line-height: 1.6;
        }

        .code {
            margin: 25px 0;
            padding: 16px;
            background: #0B1020;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            word-break: break-word;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            background: white;
            color: #0B1020;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            margin: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .button.secondary {
            background: #25304D;
            color: white;
        }

        .status {
            margin-top: 15px;
            color: #8EA2C8;
            font-size: 14px;
            min-height: 20px;
        }

        .footer {
            margin-top: 40px;
            color: #68789D;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            REZORA NETWORK
        </div>

        <div class="tagline">
            MINE • CONNECT • EARN
        </div>

        <div class="card">

            <h1>Join Rezora Network</h1>

            <p>
                Start your journey with Rezora Network.
                Use the referral code below to join.
            </p>

            <div class="code" id="referralCode">
                CF0F8FC2
            </div>

            <button class="button" onclick="copyReferral()">
                Copy Referral Code
            </button>

            <button class="button secondary" onclick="shareReferral()">
                Share
            </button>

            <p>
                Open the Rezora Network app and enter
                this referral code in the Referral section.
            </p>

            <div class="status" id="status"></div>

        </div>

        <div class="footer">
            © Rezora Network
        </div>

    </div>

    <script>
        const defaultReferralCode = "CF0F8FC2";

        function getReferralCode() {
            const params = new URLSearchParams(window.location.search);
            const ref = params.get("ref");

            if (ref && /^[A-Za-z0-9]{4,20}$/.test(ref)) {
                return ref.toUpperCase();
            }

            return defaultReferralCode;
        }

        const referralCode = getReferralCode();

        document.getElementById("referralCode").textContent = referralCode;

        function copyReferral() {
            navigator.clipboard.writeText(referralCode)
                .then(function() {
                    document.getElementById("status").textContent =
                        "Referral code copied!";
                })
                .catch(function() {
                    document.getElementById("status").textContent =
                        "Please copy the referral code manually.";
                });
        }

        function shareReferral() {
            const shareUrl =
                window.location.origin +
                window.location.pathname +
                "?ref=" +
                encodeURIComponent(referralCode);

            if (navigator.share) {
                navigator.share({
                    title: "Join Rezora Network",
                    text: "Join Rezora Network using my referral code: " + referralCode,
                    url: shareUrl
                });
            } else {
                navigator.clipboard.writeText(shareUrl)
                    .then(function() {
                        document.getElementById("status").textContent =
                            "Referral link copied!";
                    });
            }
        }
    </script>

</body>
</html>
